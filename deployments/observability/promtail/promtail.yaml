server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker

    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        regex: (identity|orchestrator)
        action: keep

      - target_label: job
        replacement: cbsaga

      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
        regex: (.+)

      - source_labels: [__meta_docker_container_name]
        target_label: container
        regex: /(.+)
        replacement: $1

    pipeline_stages:
      - docker: {}

      - json:
          expressions:
            level: level
            msg: msg
            trace_id: trace_id
            span_id: span_id

      - labels:
          job:
          service:
          container:
          level:
          trace_id:
